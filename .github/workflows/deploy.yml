name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deployment needs these; nothing else in the repo does.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The suite gates the deploy: a red simulator never reaches the URL.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
        env:
          # Project sites live at /<repo>/, so assets need that prefix.
          EXPO_BASE_URL: /${{ github.event.repository.name }}
      # Static pages that sit alongside the app rather than inside it. The Play
      # listing needs a privacy policy at a stable URL, and this is the only
      # host in the project — so the deploy has to carry it or the store link
      # dies the next time the bundle is rebuilt.
      - run: cp app/web/privacy.html app/dist/privacy.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
